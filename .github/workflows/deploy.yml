# 機器人的名字
name: Deploy static content to Pages

# 什麼時候觸發機器人？當有代碼推送到 main 分支時；
# 另外每天臺灣時間 07:05（UTC 23:05）重新部署一次，當天的分享頁才會在推薦公開後出現；
# 也可以在 GitHub 的 Actions 頁面手動執行
on:
  push:
    branches: ['main']
  schedule:
    - cron: '5 23 * * *'
  workflow_dispatch:

# 給予機器人寫入 GitHub Pages 的權限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# 機器人的工作流程
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_ADMIN_WORKER_URL: ${{ vars.VITE_ADMIN_WORKER_URL }}
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4