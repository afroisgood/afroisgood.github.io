name = "afroisgood-admin-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 這裡只放「不是秘密」的設定值。真正的金鑰一律用
#   wrangler secret put <NAME>
# 寫入，不要寫在這個檔案裡（這個檔案會被 git 追蹤）。
[vars]
# 允許呼叫這支 Worker 的前端網域，逗號分隔。
ALLOWED_ORIGINS = "https://jazzcalender365.com,https://www.jazzcalender365.com,https://afroisgood.github.io,http://localhost:5173"
# 後台資料所在的 GitHub repo 與資料夾（Worker 用 GITHUB_TOKEN 代為讀寫）。
# 資料夾裡每年一個 2026.json、2027.json…，加上更新日誌 changelog.json。
GITHUB_OWNER = "afroisgood"
GITHUB_REPO = "afroisgood.github.io"
DATA_DIR = "public/data"
# 辨識用的 Claude 模型，可依費用/準確度需求調整。
CLAUDE_MODEL = "claude-sonnet-5-5"

# 後台登入防暴力破解：同一個 IP 每 60 秒最多試 5 次。
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60
