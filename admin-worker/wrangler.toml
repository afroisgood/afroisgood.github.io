name = "afroisgood-admin-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 這裡只放「不是秘密」的設定值。真正的金鑰一律用
#   wrangler secret put <NAME>
# 寫入，不要寫在這個檔案裡（這個檔案會被 git 追蹤）。
[vars]
# 允許呼叫這支 Worker 的前端網域，逗號分隔。
ALLOWED_ORIGINS = "https://jazzcalender365.com,https://www.jazzcalender365.com,https://afroisgood.github.io,http://localhost:5173"
# 後台唯一擁有者的 GitHub 帳號 — 用來驗證呼叫者是否為站主本人。
GITHUB_OWNER = "afroisgood"
# 辨識用的 Claude 模型，可依費用/準確度需求調整。
CLAUDE_MODEL = "claude-sonnet-5-5"
